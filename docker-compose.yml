services:
  wtma-landing:
    build: .
    container_name: wtma-landing-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wtma
    environment:
      - TZ=Asia/Tashkent

networks:
  wtma:
    external: true
