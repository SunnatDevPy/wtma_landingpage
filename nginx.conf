server {
    listen 80;
    server_name landing.okaposai.uz localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip siqish (sayt yuklanishini tezlashtiradi)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Statik fayllarni brauzerda kesh qilish (30 kun)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Xavfsizlik sarlavhalari (Security headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
