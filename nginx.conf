server {
    listen 80;
    server_name landing.okaposai.uz localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip siqish (sayt yuklanishini tezlashtiradi)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # HTML fayllarni keshlamaslik (havolalar va matnlar darhol yangilanishi uchun)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Statik media fayllarni brauzerda kesh qilish (30 kun)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API so'rovlarni ichki Node.js Telegram xizmatiga yo'naltirish
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }


    # Xavfsizlik sarlavhalari (Security headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
